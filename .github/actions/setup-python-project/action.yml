name: Setup Python project
description: Install uv, optionally verify the lockfile, and install project dependencies

inputs:
  check-lock:
    description: Whether to verify that the lockfile is up to date
    required: false
    default: 'false'

runs:
  using: composite
  steps:

    # Python version is set in .python-version file
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: 0.11.29

    - name: Verify lock is up to date
      if: ${{ inputs.check-lock == 'true' }}
      shell: bash
      run: uv lock --check

    - name: Install dependencies
      shell: bash
      run: make install
