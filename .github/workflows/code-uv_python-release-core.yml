name: code-uv-python-release-core

on:
  workflow_call:
    inputs:
      release_type:
        description: Optional release type supplied by the fixed release workflow.
        required: false
        type: string
        default: ''
    outputs:
      release_commit:
        description: Immutable commit used to build the release artifacts.
        value: ${{ jobs.prepare-release.outputs.release_commit }}
      releases:
        description: JSON array of release tags, versions, and package names.
        value: ${{ jobs.prepare-release.outputs.releases }}
    secrets:
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

env:
  CI_GOVERNANCE_RELEASE_STAGING_REF: refs/ci-governance/release/${{ github.run_id }}-${{ github.run_attempt }}
  PROJECT_TYPE: ${{ vars.PROJECT_TYPE }}
  WORKING_DIRECTORY: ${{ vars.WORKING_DIRECTORY }}
  ASDF_BRANCH_VERSION: '0.18.0'

jobs:
  prepare-release:
    name: Prepare Release
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        (
          (vars.DEVELOPMENT_FLOW == 'trunk-based-development' && (github.ref_name == 'main' || startsWith(github.ref_name, 'main-'))) ||
          (vars.DEVELOPMENT_FLOW == 'git-flow' && (github.ref_name == 'main' || startsWith(github.ref_name, 'main-')))
        )
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged &&
        github.event.pull_request.head.ref != 'automated/ci-governance-sync' &&
        !contains(join(github.event.pull_request.labels.*.name, ','), 'skip-release') &&
        (
          (vars.DEVELOPMENT_FLOW == 'trunk-based-development' && (github.event.pull_request.base.ref == 'main' || startsWith(github.event.pull_request.base.ref, 'main-'))) ||
          (vars.DEVELOPMENT_FLOW == 'git-flow' && (github.event.pull_request.base.ref == 'main' || startsWith(github.event.pull_request.base.ref, 'main-')))
        ) &&
        (
          contains(join(github.event.pull_request.labels.*.name, ','), 'release-type') ||
          vars.DEVELOPMENT_FLOW == 'trunk-based-development'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      expected_ref: ${{ steps.release-plan.outputs.expected_ref }}
      release_commit: ${{ steps.release-metadata.outputs.release_commit }}
      releases: ${{ steps.release-metadata.outputs.releases }}
      staging_ref: ${{ steps.release-metadata.outputs.staging_ref }}
    steps:
      - name: Resolve release context
        id: release-context
        env:
          EVENT_SHA: ${{ github.sha }}
          PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REQUESTED_RELEASE_TYPE: ${{ inputs.release_type }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            baseline_branch="$GITHUB_REF_NAME"
            release_labels="$REQUESTED_RELEASE_TYPE"
            release_ref="$EVENT_SHA"
          else
            baseline_branch="$PR_BASE_BRANCH"
            release_labels="$PR_LABELS"
            release_ref="$PR_MERGE_SHA"
          fi

          if [[ -z "$baseline_branch" || ! "$release_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid release context::A baseline branch and immutable release commit are required."
            exit 1
          fi

          {
            echo "baseline_branch=$baseline_branch"
            echo "release_labels=$release_labels"
            echo "release_ref=$release_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce protected release branch
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_BRANCH: ${{ steps.release-context.outputs.baseline_branch }}
        shell: bash
        run: |
          set -euo pipefail
          protected="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${BASELINE_BRANCH}" --jq '.protected')"
          if [[ "$protected" != "true" ]]; then
            echo "::error title=Unprotected release branch::Releases require a protected baseline branch; '${BASELINE_BRANCH}' is not protected." >&2
            exit 1
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release-context.outputs.release_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Read governed tool versions
        id: tool-versions
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -Evq '^[a-zA-Z0-9_-]+ [a-zA-Z0-9._+-]+$' .tool-versions; then
            echo "::error title=Invalid tool-versions::${WORKING_DIRECTORY}/.tool-versions is malformed."
            exit 1
          fi
          {
            echo "tool_versions<<EOF"
            cat .tool-versions
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up asdf-managed Python
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
        with:
          tool_versions: ${{ steps.tool-versions.outputs.tool_versions }}
          asdf_version: ${{ env.ASDF_BRANCH_VERSION }}

      - name: Point uv at the asdf-managed interpreter
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "UV_PYTHON=$(asdf where python)/bin/python" >> "$GITHUB_ENV"

      - name: Set up UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.9.7'
          enable-cache: true
          working-directory: ${{ env.WORKING_DIRECTORY }}
          cache-dependency-glob: ${{ env.WORKING_DIRECTORY }}/uv.lock

      - name: Verify release candidate
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check

          case "$PROJECT_TYPE" in
            single)
              uv sync --frozen --all-extras --all-groups
              uv run --no-sync ruff format --check .
              uv run --no-sync ruff check .
              uv run --no-sync ty check
              uv run --no-sync pytest
              ;;
            workspaces)
              uv sync --frozen --all-extras --all-groups --all-packages
              uv run --no-sync --all-packages ruff format --check .
              uv run --no-sync --all-packages ruff check .
              uv run --no-sync --all-packages ty check
              uv run --no-sync --all-packages pytest
              ;;
            *)
              echo "::error title=Invalid project type::PROJECT_TYPE must be single or workspaces."
              exit 1
              ;;
          esac

      - name: Plan release metadata
        id: release-plan
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BASELINE_BRANCH: ${{ steps.release-context.outputs.baseline_branch }}
          DEVELOPMENT_FLOW: ${{ vars.DEVELOPMENT_FLOW }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_LABELS: ${{ steps.release-context.outputs.release_labels }}
          RELEASE_REF: ${{ steps.release-context.outputs.release_ref }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          gh auth setup-git

          descriptor="$GITHUB_WORKSPACE/.github/inditextech-ci-python.json"
          records_file="$RUNNER_TEMP/python-release-records.jsonl"
          packages_file="$RUNNER_TEMP/python-release-packages.txt"
          source_commit="$(git rev-parse "$RELEASE_REF^{commit}")"
          expected_ref="refs/heads/$BASELINE_BRANCH"
          remote_line="$(git ls-remote --exit-code origin "$expected_ref")"
          read -r remote_commit remote_ref extra <<< "$remote_line"

          if [[ "$remote_ref" != "$expected_ref" || -n "${extra:-}" ]]; then
            echo "::error title=Release branch verification failed::Could not resolve exactly one destination branch."
            exit 1
          fi

          resume="false"
          release_commit=""
          if [[ "$remote_commit" != "$source_commit" ]]; then
            git fetch --no-tags origin "$remote_commit"
            release_commit="$(git rev-list --ancestry-path --reverse "${source_commit}..${remote_commit}" | head -1)"
            if [[ -z "$release_commit" ]] \
              || [[ "$(git rev-parse "${release_commit}^")" != "$source_commit" ]] \
              || [[ "$(git show -s --format=%s "$release_commit")" != "[python-release] Prepare release" ]]; then
              echo "::error title=Release branch advanced::The destination branch moved after the release source commit."
              exit 1
            fi
            git checkout --detach "$release_commit"
            resume="true"
          fi

          case ",$RELEASE_LABELS," in
            *",release-type/major,"*) release_bump="major" ;;
            *",release-type/minor,"*) release_bump="minor" ;;
            *",release-type/hotfix,"*|*",release-type/multi-hotfix,"*|*",release-type/patch,"*)
              release_bump="patch"
              ;;
            *)
              if [[ "$DEVELOPMENT_FLOW" == "trunk-based-development" ]]; then
                release_bump="minor"
              else
                echo "::error title=Missing release type::git-flow releases require a release-type label."
                exit 1
              fi
              ;;
          esac

          if [[ "$PROJECT_TYPE" == "single" ]]; then
            python3 - <<'PY' > "$packages_file"
          from pathlib import Path
          import tomllib

          with Path("pyproject.toml").open("rb") as handle:
              name = tomllib.load(handle).get("project", {}).get("name")
          if not isinstance(name, str) or not name:
              raise SystemExit("pyproject.toml must declare project.name")
          print(name)
          PY
            release_strategy=single
          elif [[ "$PROJECT_TYPE" == "workspaces" ]]; then
            jq -er '.release.packages[]' "$descriptor" > "$packages_file"
            release_strategy="$(jq -er '.release.strategy' "$descriptor")"
          else
            echo "::error title=Invalid project type::PROJECT_TYPE must be single or workspaces."
            exit 1
          fi

          reconcile_internal_pins() {
            versions_file="$RUNNER_TEMP/python-release-versions.tsv"
            : > "$versions_file"
            while IFS= read -r package; do
              printf '%s\t%s\n' "$package" "$(uv version --package "$package" --short)" >> "$versions_file"
            done < "$packages_file"
            python3 - "$versions_file" <<'PY'
          import re
          import sys
          import tomllib
          from pathlib import Path

          PIN = re.compile(
              r"^\s*(?P<name>[A-Za-z0-9][A-Za-z0-9._-]*)(?P<extras>\[[^\]]*\])?"
              r"\s*==\s*(?P<version>[^\s,;]+)(?P<rest>.*)$"
          )
          SKIP = {".venv", "venv", "build", "dist", "node_modules"}


          def normalize(name):
              return re.sub(r"[-_.]+", "-", name).lower()


          def requirements(document):
              project = document.get("project", {})
              yield from project.get("dependencies", [])
              for group in project.get("optional-dependencies", {}).values():
                  yield from group
              for group in document.get("dependency-groups", {}).values():
                  yield from group
              uv = document.get("tool", {}).get("uv", {})
              for key in ("constraint-dependencies", "override-dependencies"):
                  yield from uv.get(key, [])


          versions = {}
          for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              if line.strip():
                  name, version = line.split("\t")
                  versions[normalize(name)] = version

          for path in sorted(Path(".").rglob("pyproject.toml")):
              if SKIP.intersection(path.parts):
                  continue
              text = path.read_text(encoding="utf-8")
              document = tomllib.loads(text)
              declared = [item for item in requirements(document) if isinstance(item, str)]
              for requirement in dict.fromkeys(declared):
                  match = PIN.match(requirement)
                  if match is None:
                      continue
                  target = versions.get(normalize(match.group("name")))
                  if target is None or target == match.group("version"):
                      continue
                  updated = "{}{}=={}{}".format(
                      match.group("name"), match.group("extras") or "", target, match.group("rest")
                  )
                  rewritten = text
                  for quote in ('"', "'"):
                      rewritten = rewritten.replace(
                          quote + requirement + quote, quote + updated + quote
                      )
                  if rewritten == text:
                      raise SystemExit(
                          "::error title=Unreconciled internal pin::{} declares {} and it could not be rewritten.".format(path, requirement)
                      )
                  text = rewritten
                  print("{}: {} -> {}".format(path, requirement, updated))
              path.write_text(text, encoding="utf-8")
          PY
          }

          write_records() {
            : > "$records_file"
            if [[ "$release_strategy" == "single" ]]; then
              package="$(<"$packages_file")"
              version="$(uv version --short)"
              jq -cn \
                --arg package "$package" \
                --arg version "$version" \
                --arg tag "v$version" \
                '{packages: [$package], version: $version, tag: $tag}' >> "$records_file"
              return
            fi

            if [[ "$release_strategy" == "locked-step" ]]; then
              packages=()
              while IFS= read -r package; do
                packages+=("$package")
              done < "$packages_file"
              versions=()
              for package in "${packages[@]}"; do
                versions+=("$(uv version --package "$package" --short)")
              done
              if [[ "$(printf '%s\n' "${versions[@]}" | sort -u | wc -l | tr -d ' ')" -ne 1 ]]; then
                echo "::error title=Invalid locked-step workspace::All release packages must have the same version."
                exit 1
              fi
              packages_json="$(printf '%s\n' "${packages[@]}" | jq -R . | jq -sc .)"
              jq -cn \
                --argjson packages "$packages_json" \
                --arg version "${versions[0]}" \
                --arg tag "v${versions[0]}" \
                '{packages: $packages, version: $version, tag: $tag}' >> "$records_file"
              return
            fi

            while IFS= read -r package; do
              version="$(uv version --package "$package" --short)"
              jq -cn \
                --arg package "$package" \
                --arg version "$version" \
                --arg tag "${package}-v${version}" \
                '{packages: [$package], version: $version, tag: $tag}' >> "$records_file"
            done < "$packages_file"
          }

          if [[ "$resume" == "false" ]]; then
            if [[ "$release_strategy" == "single" ]]; then
              uv version --bump "$release_bump"
            else
              while IFS= read -r package; do
                uv version --package "$package" --bump "$release_bump"
              done < "$packages_file"
              reconcile_internal_pins
            fi
            uv lock
            uv lock --check
            write_records
            releases="$(jq -cs . "$records_file")"

            while IFS= read -r tag; do
              if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
                echo "::error title=Tag conflict::$tag already exists."
                exit 1
              fi
            done < <(jq -r '.[].tag' <<< "$releases")

            git -C "$GITHUB_WORKSPACE" add --update -- "$WORKING_DIRECTORY"
            if git diff --cached --quiet; then
              echo "::error title=Missing release metadata::Versioning did not produce changes to commit."
              exit 1
            fi

            primary_version="$(jq -r '.[0].version' <<< "$releases")"
            echo "RELEASE_VERSION=$primary_version" >> "$GITHUB_ENV"
            echo "RELEASE_BUMP=$release_bump" >> "$GITHUB_ENV"
          else
            write_records
            releases="$(jq -cs . "$records_file")"
            head_commit="$(git rev-parse HEAD)"
            while IFS= read -r tag; do
              if [[ "$(git rev-list -n 1 "$tag")" != "$head_commit" ]]; then
                echo "::error title=Incomplete release resume::$tag does not point to the release commit."
                exit 1
              fi
            done < <(jq -r '.[].tag' <<< "$releases")
          fi

          {
            echo "resume=$resume"
            echo "expected_ref=$expected_ref"
            echo "releases_intermediate<<EOF"
            printf '%s\n' "$releases"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bump CHANGELOG for release
        if: steps.release-plan.outputs.resume != 'true'
        uses: release-flow/keep-a-changelog-action@74931dec7ecdbfc8e38ac9ae7e8dd84c08db2f32 # v3.0.0
        with:
          command: bump
          version: ${{ env.RELEASE_BUMP }}
          changelog: ${{ env.WORKING_DIRECTORY }}/CHANGELOG.md
          fail-on-empty-release-notes: false
          keep-unreleased-section: true
          tag-prefix: ""

      - name: Reconcile CHANGELOG version with release
        if: steps.release-plan.outputs.resume != 'true'
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          cl="CHANGELOG.md"
          cl_ver="$(grep -m1 -E '^## \[[0-9]' "$cl" | sed -E 's/^## \[([^]]+)\].*/\1/')"
          if [[ -z "$cl_ver" ]]; then
            echo "::error title=CHANGELOG has no release entry::Expected a '## [X.Y.Z]' heading after the bump step."
            exit 1
          fi
          if [[ "$cl_ver" != "$RELEASE_VERSION" ]]; then
            echo "::notice title=CHANGELOG version reconciled::keep-a-changelog wrote ${cl_ver}; re-anchoring to uv release ${RELEASE_VERSION}."
            cl_ver_re="${cl_ver//./\\.}"
            sed -i -E "s@^## \[${cl_ver_re}\]( - )@## [${RELEASE_VERSION}]\1@" "$cl"
            sed -i -E "s@^(\[Unreleased\]: .*/compare/)${cl_ver_re}(\.\.\.HEAD)@\1${RELEASE_VERSION}\2@" "$cl"
            sed -i -E "s@^\[${cl_ver_re}\]: (.*/)(compare/[^ ]*\.\.\.|releases/tag/)${cl_ver_re}@[${RELEASE_VERSION}]: \1\2${RELEASE_VERSION}@" "$cl"
          fi

      - name: Commit and stage release
        if: steps.release-plan.outputs.resume != 'true'
        id: release-commit
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASES: ${{ steps.release-plan.outputs.releases_intermediate }}
          EXPECTED_REF: ${{ steps.release-plan.outputs.expected_ref }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" add -- "$WORKING_DIRECTORY/CHANGELOG.md"
          git -C "$GITHUB_WORKSPACE" add --update -- "$WORKING_DIRECTORY"
          if git diff --cached --quiet; then
            echo "::error title=Missing release metadata::Versioning did not produce changes to commit."
            exit 1
          fi
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "[python-release] Prepare release"

          while IFS= read -r record; do
            tag="$(jq -r '.tag' <<< "$record")"
            git check-ref-format --allow-onelevel "refs/tags/$tag"
          done < <(jq -c '.[]' <<< "$RELEASES")

          git push --atomic --force origin "HEAD:$CI_GOVERNANCE_RELEASE_STAGING_REF"

      - name: Publish release metadata
        id: release-metadata
        env:
          RELEASES: ${{ steps.release-plan.outputs.releases_intermediate }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "release_commit=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            echo "staging_ref=$CI_GOVERNANCE_RELEASE_STAGING_REF"
            echo "releases<<EOF"
            printf '%s\n' "$RELEASES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-distributions:
    name: Build ${{ matrix.release.tag }}
    needs: prepare-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.prepare-release.outputs.releases) }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.release_commit }}

      - name: Read governed tool versions
        id: tool-versions
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -Evq '^[a-zA-Z0-9_-]+ [a-zA-Z0-9._+-]+$' .tool-versions; then
            echo "::error title=Invalid tool-versions::${WORKING_DIRECTORY}/.tool-versions is malformed."
            exit 1
          fi
          {
            echo "tool_versions<<EOF"
            cat .tool-versions
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up asdf-managed Python
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
        with:
          tool_versions: ${{ steps.tool-versions.outputs.tool_versions }}
          asdf_version: ${{ env.ASDF_BRANCH_VERSION }}

      - name: Point uv at the asdf-managed interpreter
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "UV_PYTHON=$(asdf where python)/bin/python" >> "$GITHUB_ENV"

      - name: Set up UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.9.7'
          enable-cache: true
          working-directory: ${{ env.WORKING_DIRECTORY }}
          cache-dependency-glob: ${{ env.WORKING_DIRECTORY }}/uv.lock

      - name: Build declared distributions
        env:
          RELEASE: ${{ toJSON(matrix.release) }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          rm -rf dist

          if [[ "$PROJECT_TYPE" == "single" ]]; then
            uv build --out-dir dist
          else
            while IFS= read -r package; do
              uv build --package "$package" --out-dir dist
            done < <(jq -r '.packages[]' <<< "$RELEASE")
          fi

      - name: Upload release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions-${{ matrix.release.tag }}
          path: ${{ env.WORKING_DIRECTORY }}/dist/*
          if-no-files-found: error
          retention-days: 14

  finalize-release:
    name: Finalize release (promote + next dev)
    needs: [prepare-release, build-distributions]
    if: '!cancelled() && needs.prepare-release.result == ''success'''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Read governed tool versions
        id: tool-versions
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -Evq '^[a-zA-Z0-9_-]+ [a-zA-Z0-9._+-]+$' .tool-versions; then
            echo "::error title=Invalid tool-versions::${WORKING_DIRECTORY}/.tool-versions is malformed."
            exit 1
          fi
          {
            echo "tool_versions<<EOF"
            cat .tool-versions
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up asdf-managed Python
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
        with:
          tool_versions: ${{ steps.tool-versions.outputs.tool_versions }}
          asdf_version: ${{ env.ASDF_BRANCH_VERSION }}

      - name: Point uv at the asdf-managed interpreter
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "UV_PYTHON=$(asdf where python)/bin/python" >> "$GITHUB_ENV"

      - name: Set up UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.9.7'
          enable-cache: true
          working-directory: ${{ env.WORKING_DIRECTORY }}
          cache-dependency-glob: ${{ env.WORKING_DIRECTORY }}/uv.lock

      - name: Promote the release to the default branch
        id: promote
        if: needs.build-distributions.result == 'success' || needs.build-distributions.result == 'skipped'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          EXPECTED_REF: ${{ needs.prepare-release.outputs.expected_ref }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASES: ${{ needs.prepare-release.outputs.releases }}
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.release_commit }}
          STAGING_REF: ${{ needs.prepare-release.outputs.staging_ref }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

          git fetch --no-tags origin "+${STAGING_REF}:refs/ci-governance/staged" 2>/dev/null || true
          if [[ "$(git ls-remote origin "$EXPECTED_REF" | cut -f1)" == "$RELEASE_COMMIT" ]]; then
            echo "::notice title=Promotion skipped::$EXPECTED_REF already points at the release commit."
            git checkout --force --detach "$RELEASE_COMMIT"
            exit 0
          fi

          if [[ "$(git rev-parse --verify --quiet refs/ci-governance/staged || true)" != "$RELEASE_COMMIT" ]]; then
            echo "::error title=Release staging mismatch::$STAGING_REF does not point at the release commit."
            exit 1
          fi
          git checkout --force --detach "$RELEASE_COMMIT"

          tag_refs=()
          while IFS= read -r record; do
            tag="$(jq -r '.tag' <<< "$record")"
            version="$(jq -r '.version' <<< "$record")"
            git check-ref-format --allow-onelevel "refs/tags/$tag"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "::error title=Tag conflict::$tag already exists."
              exit 1
            fi
            git tag -a "$tag" -m "Release $version"
            tag_refs+=("refs/tags/$tag")
          done < <(jq -c '.[]' <<< "$RELEASES")

          git push --atomic origin "${RELEASE_COMMIT}:${EXPECTED_REF}" "${tag_refs[@]}"

      - name: Next development iteration and sync PR
        if: steps.promote.outcome == 'success' && vars.DEVELOPMENT_FLOW == 'git-flow'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BASELINE_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASES: ${{ needs.prepare-release.outputs.releases }}
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.release_commit }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

          if [[ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]]; then
            echo "::notice title=Next-dev skipped::Branch already advanced past the release commit."
          else
            descriptor="$GITHUB_WORKSPACE/.github/inditextech-ci-python.json"
            if [[ "$PROJECT_TYPE" == "single" ]]; then
              uv version --bump minor
              uv version "$(uv version --short).dev0"
            else
              packages="$(jq -er '.release.packages[]' "$descriptor")" || {
                echo "::error title=Invalid descriptor::Could not read .release.packages from $descriptor."
                exit 1
              }
              while IFS= read -r package; do
                uv version --package "$package" --bump minor
                uv version --package "$package" "$(uv version --package "$package" --short).dev0"
              done <<< "$packages"
            fi
            uv lock
            git add --update -- .
            git commit -m "[python-release] prepare for next development iteration"
            git push origin "HEAD:refs/heads/$BASELINE_BRANCH"
          fi

          version="$(jq -r '.[0].version' <<< "$RELEASES")"
          develop_branch="${BASELINE_BRANCH/main/develop}"
          if [[ -z "$(git ls-remote --heads origin "$develop_branch")" ]]; then
            echo "::notice title=Sync skipped::$develop_branch does not exist."
            exit 0
          fi
          sync_branch="automated/sync-release-${version}-to-${develop_branch}"
          git switch --force-create "$sync_branch" "origin/$BASELINE_BRANCH"
          git push --force-with-lease --set-upstream origin "$sync_branch"

          if [[ -z "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$sync_branch" --base "$develop_branch" --state open --json number --jq '.[0].number // empty')" ]]; then
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base "$develop_branch" --head "$sync_branch" \
              --title "Sync release $version to $develop_branch" \
              --body "**Automated pull request** syncing the release cut on \`$BASELINE_BRANCH\` back into \`$develop_branch\`."
          fi

      - name: Discard the release staging ref
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STAGING_REF: ${{ needs.prepare-release.outputs.staging_ref }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${STAGING_REF:-}" ]]; then
            exit 0
          fi
          gh auth setup-git
          git push origin ":${STAGING_REF}" || true
