name: code-uv-python-build-snapshot
run-name: Build Python snapshot from ${{ github.event_name }}

on:
  workflow_dispatch:
  push:
    branches: [main, main-*, develop, develop-*]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, main-*, develop, develop-*]

permissions:
  contents: read

concurrency:
  group: code-uv-python-build-snapshot-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROJECT_TYPE: ${{ vars.PROJECT_TYPE }}
  WORKING_DIRECTORY: ${{ vars.WORKING_DIRECTORY }}

jobs:
  build-snapshot:
    name: Build Snapshot
    if: >-
      (
        vars.DEVELOPMENT_FLOW == 'trunk-based-development' &&
        (
          (github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || startsWith(github.ref_name, 'main-'))) ||
          (github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'main' || startsWith(github.event.pull_request.base.ref, 'main-'))) ||
          (github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref_name, 'main-')))
        )
      ) ||
      (
        vars.DEVELOPMENT_FLOW == 'git-flow' &&
        (
          (github.event_name == 'workflow_dispatch' && (github.ref_name == 'develop' || startsWith(github.ref_name, 'develop-'))) ||
          (github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'develop' || startsWith(github.event.pull_request.base.ref, 'develop-'))) ||
          (github.event_name == 'push' && (github.ref_name == 'develop' || startsWith(github.ref_name, 'develop-')))
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      publish_snapshot: ${{ steps.build.outputs.publish_snapshot }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Read governed tool versions
        id: tool-versions
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -Evq '^[a-zA-Z0-9_-]+ [a-zA-Z0-9._+-]+$' .tool-versions; then
            echo "::error title=Invalid tool-versions::${WORKING_DIRECTORY}/.tool-versions is malformed."
            exit 1
          fi
          {
            echo "tool_versions<<EOF"
            cat .tool-versions
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up asdf-managed Python
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
        with:
          tool_versions: ${{ steps.tool-versions.outputs.tool_versions }}

      - name: Point uv at the asdf-managed interpreter
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "UV_PYTHON=$(asdf where python)/bin/python" >> "$GITHUB_ENV"

      - name: Set up UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.9.7'
          enable-cache: true
          working-directory: ${{ env.WORKING_DIRECTORY }}
          cache-dependency-glob: ${{ env.WORKING_DIRECTORY }}/uv.lock

      - name: Verify and build distributions
        id: build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check

          head_subject="$(git show -s --format=%s HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$head_subject" == "[python-release] prepare for next development iteration" ]]; then
            echo "::notice title=Snapshot skipped::Next-dev commit does not need a snapshot."
            echo "publish_snapshot=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$PROJECT_TYPE" == "single" ]]; then
              # Strip any existing pre-release suffix before stamping the snapshot.
              # After a release, the next-dev bump leaves the develop base at
              # X.Y.Z.dev0; appending a second .dev<run_id> yields X.Y.Z.dev0.dev<id>,
              # which is invalid PEP 440 (uv rejects it). Replace the suffix, don't append.
              base="$(uv version --short)"
              uv version "${base%.dev*}.dev${GITHUB_RUN_ID}"
            else
              packages="$(jq -er '.release.packages[]' "$GITHUB_WORKSPACE/.github/inditextech-ci-python.json")" || {
                echo "::error title=Invalid descriptor::Could not read .release.packages from the CI descriptor."
                exit 1
              }
              while IFS= read -r package; do
                # Same suffix-replace as the single-package case above.
                base="$(uv version --package "$package" --short)"
                uv version --package "$package" "${base%.dev*}.dev${GITHUB_RUN_ID}"
              done <<< "$packages"
            fi
            uv lock
          fi

          case "$PROJECT_TYPE" in
            single)
              uv sync --frozen --all-extras --all-groups
              uv run --no-sync ruff format --check .
              uv run --no-sync ruff check .
              uv run --no-sync ty check
              uv run --no-sync pytest
              uv build --out-dir dist
              ;;
            workspaces)
              uv sync --frozen --all-extras --all-groups --all-packages
              uv run --no-sync --all-packages ruff format --check .
              uv run --no-sync --all-packages ruff check .
              uv run --no-sync --all-packages ty check
              uv run --no-sync --all-packages pytest
              uv build --all-packages --out-dir dist
              ;;
            *)
              echo "::error title=Invalid project type::PROJECT_TYPE must be single or workspaces."
              exit 1
              ;;
          esac

      - name: Upload snapshot distributions
        if: steps.build.outputs.publish_snapshot != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-snapshot-${{ github.event.pull_request.number || github.run_id }}
          path: ${{ env.WORKING_DIRECTORY }}/dist/*
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish snapshot to TestPyPI
    needs: build-snapshot
    if: github.event_name == 'push' && needs.build-snapshot.outputs.publish_snapshot != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download snapshot distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-snapshot-*
          path: dist
          merge-multiple: true

      - name: Validate trusted publishing boundary
        uses: InditexTech/gh-actions/pypi@977030536dbdb52a7fe2fd5979510fd6a225d035 # v1.1.0
        with:
          packages-dir: dist
          repository-url: 'https://test.pypi.org/legacy/'
          skip-existing: 'true'
          verify-metadata: 'true'

      - name: Publish to TestPyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          repository-url: 'https://test.pypi.org/legacy/'
          skip-existing: 'true'
          verify-metadata: 'true'
