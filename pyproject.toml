[tool.uv.workspace]
members = ["packages/*"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "reuse[charset-normalizer]==6.2.0",
    "ruff==0.15.22",
    "ty==0.0.62",
    "typer==0.27.0",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["packages"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "integration: tests interactions across package or external boundaries",
    "unit: tests one package unit in isolation",
]

[tool.coverage.run]
branch = true
source = ["packages"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors / Flake8
    "W",    # pycodestyle warnings / Flake8
    "F",    # pyflakes / Flake8
    "I",    # isort
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "D",    # pydocstyle /flake8-docstrings
]

ignore = [
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D107",  # Missing docstring in __init__
]
per-file-ignores = {"**/tests/**" = ["D"]}

fixable = ["ALL"]
unfixable = []


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
